<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 150" width="1040" height="150" role="img" aria-label="Bench2Bot pipeline: set up data collection, run robot and record, fine-tune VLA, test VLA">
  <defs><filter id="s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.06"/></filter></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <rect x="3.5" y="2.5" width="242" height="142" rx="14" fill="#F8FAFB" stroke="#E2E8F0" stroke-width="1" filter="url(#s)"/>
    <rect x="23" y="22" width="40" height="22" rx="11" fill="#10A2C1" fill-opacity="0.15"/>
    <text x="43.75" y="37.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0B7A92">01</text>
    <text x="23" y="76" font-size="17" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Set up data collection</text>
    <text x="23" y="102" font-size="14.5" fill="#59636E">Hand-guide the arm to the</text>
    <text x="23" y="122" font-size="14.5" fill="#59636E">key poses of each layout</text>
    <path d="M254.0 67.0 L259.5 73.0 L254.0 79.0" fill="none" stroke="#B6BEC8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="267.5" y="2.5" width="242" height="142" rx="14" fill="#F8FAFB" stroke="#E2E8F0" stroke-width="1" filter="url(#s)"/>
    <rect x="287" y="22" width="40" height="22" rx="11" fill="#10A2C1" fill-opacity="0.15"/>
    <text x="307.75" y="37.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0B7A92">02</text>
    <text x="287" y="76" font-size="17" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Run robot and record</text>
    <text x="287" y="102" font-size="14.5" fill="#59636E">Robot replays the transfer,</text>
    <text x="287" y="122" font-size="14.5" fill="#59636E">two cameras record it</text>
    <path d="M518.0 67.0 L523.5 73.0 L518.0 79.0" fill="none" stroke="#B6BEC8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="531.5" y="2.5" width="242" height="142" rx="14" fill="#F8FAFB" stroke="#E2E8F0" stroke-width="1" filter="url(#s)"/>
    <rect x="551" y="22" width="40" height="22" rx="11" fill="#10A2C1" fill-opacity="0.15"/>
    <text x="571.75" y="37.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0B7A92">03</text>
    <text x="551" y="76" font-size="17" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Fine-tune VLA</text>
    <text x="551" y="102" font-size="14.5" fill="#59636E">Train π0 on 3 demos</text>
    <text x="551" y="122" font-size="14.5" fill="#59636E">in LeRobot format</text>
    <path d="M782.0 67.0 L787.5 73.0 L782.0 79.0" fill="none" stroke="#B6BEC8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="795.5" y="2.5" width="242" height="142" rx="14" fill="#F8FAFB" stroke="#E2E8F0" stroke-width="1" filter="url(#s)"/>
    <rect x="815" y="22" width="40" height="22" rx="11" fill="#10A2C1" fill-opacity="0.15"/>
    <text x="835.75" y="37.5" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#0B7A92">04</text>
    <text x="815" y="76" font-size="17" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Test VLA</text>
    <text x="815" y="102" font-size="14.5" fill="#59636E">Run the policy on the</text>
    <text x="815" y="122" font-size="14.5" fill="#59636E">held-out layout</text>
  </g>
</svg>
