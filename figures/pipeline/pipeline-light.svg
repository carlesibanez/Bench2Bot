<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 136" width="1040" height="136" role="img" aria-label="Bench2Bot pipeline: set up data collection, run robot and record, fine-tune VLA, test VLA">
  <path d="M10 12 H796" stroke="#10A2C1" stroke-opacity="0.35" stroke-width="1.5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <circle cx="10" cy="12" r="9" fill="#10A2C1" fill-opacity="0.18"/>
    <circle cx="10" cy="12" r="4.5" fill="#10A2C1"/>
    <text x="8" y="52" font-size="13" font-weight="600" letter-spacing="2.5" fill="#0B7A92">01</text>
    <text x="8" y="80" font-size="18" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Set up data collection</text>
    <text x="8" y="106" font-size="15" fill="#59636E">Hand-guide the arm to the</text>
    <text x="8" y="126" font-size="15" fill="#59636E">key poses of each layout</text>
    <circle cx="272" cy="12" r="9" fill="#10A2C1" fill-opacity="0.18"/>
    <circle cx="272" cy="12" r="4.5" fill="#10A2C1"/>
    <text x="270" y="52" font-size="13" font-weight="600" letter-spacing="2.5" fill="#0B7A92">02</text>
    <text x="270" y="80" font-size="18" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Run robot and record</text>
    <text x="270" y="106" font-size="15" fill="#59636E">Robot replays the transfer,</text>
    <text x="270" y="126" font-size="15" fill="#59636E">two cameras record it</text>
    <circle cx="534" cy="12" r="9" fill="#10A2C1" fill-opacity="0.18"/>
    <circle cx="534" cy="12" r="4.5" fill="#10A2C1"/>
    <text x="532" y="52" font-size="13" font-weight="600" letter-spacing="2.5" fill="#0B7A92">03</text>
    <text x="532" y="80" font-size="18" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Fine-tune VLA</text>
    <text x="532" y="106" font-size="15" fill="#59636E">Train π0 on 3 demos</text>
    <text x="532" y="126" font-size="15" fill="#59636E">in LeRobot format</text>
    <circle cx="796" cy="12" r="9" fill="#10A2C1" fill-opacity="0.18"/>
    <circle cx="796" cy="12" r="4.5" fill="#10A2C1"/>
    <text x="794" y="52" font-size="13" font-weight="600" letter-spacing="2.5" fill="#0B7A92">04</text>
    <text x="794" y="80" font-size="18" font-weight="600" letter-spacing="-0.2" fill="#1F2937">Test VLA</text>
    <text x="794" y="106" font-size="15" fill="#59636E">Run the policy on the</text>
    <text x="794" y="126" font-size="15" fill="#59636E">held-out layout</text>
  </g>
</svg>
