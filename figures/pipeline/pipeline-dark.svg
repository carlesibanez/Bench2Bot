<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 158" width="1040" height="158" role="img" aria-label="Bench2Bot pipeline: set up data collection, run robot and record, fine-tune VLA, test VLA">
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="3.5" y="3" width="229" height="152" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <circle cx="118.0" cy="36" r="15" fill="#45D1D9"/>
    <text x="118.0" y="41" font-size="15" font-weight="700" fill="#0D1117">1</text>
    <text x="118.0" y="84" font-size="18" font-weight="600" fill="#E6EDF3">Set up data collection</text>
    <text x="118.0" y="111" font-size="15" fill="#9198A1">Hand-guide the arm to the</text>
    <text x="118.0" y="131" font-size="15" fill="#9198A1">key poses of each layout</text>
    <path d="M240.5 79.0 H257.5" stroke="#656C76" stroke-width="2" stroke-linecap="round"/>
    <path d="M256.5 74.0 L263.5 79.0 L256.5 84.0 Z" fill="#656C76"/>
    <rect x="271.5" y="3" width="229" height="152" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <circle cx="386.0" cy="36" r="15" fill="#45D1D9"/>
    <text x="386.0" y="41" font-size="15" font-weight="700" fill="#0D1117">2</text>
    <text x="386.0" y="84" font-size="18" font-weight="600" fill="#E6EDF3">Run robot and record</text>
    <text x="386.0" y="111" font-size="15" fill="#9198A1">Robot replays the transfer,</text>
    <text x="386.0" y="131" font-size="15" fill="#9198A1">two cameras record it</text>
    <path d="M508.5 79.0 H525.5" stroke="#656C76" stroke-width="2" stroke-linecap="round"/>
    <path d="M524.5 74.0 L531.5 79.0 L524.5 84.0 Z" fill="#656C76"/>
    <rect x="539.5" y="3" width="229" height="152" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <circle cx="654.0" cy="36" r="15" fill="#45D1D9"/>
    <text x="654.0" y="41" font-size="15" font-weight="700" fill="#0D1117">3</text>
    <text x="654.0" y="84" font-size="18" font-weight="600" fill="#E6EDF3">Fine-tune VLA</text>
    <text x="654.0" y="111" font-size="15" fill="#9198A1">Train π0 on 3 demos</text>
    <text x="654.0" y="131" font-size="15" fill="#9198A1">in LeRobot format</text>
    <path d="M776.5 79.0 H793.5" stroke="#656C76" stroke-width="2" stroke-linecap="round"/>
    <path d="M792.5 74.0 L799.5 79.0 L792.5 84.0 Z" fill="#656C76"/>
    <rect x="807.5" y="3" width="229" height="152" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <circle cx="922.0" cy="36" r="15" fill="#45D1D9"/>
    <text x="922.0" y="41" font-size="15" font-weight="700" fill="#0D1117">4</text>
    <text x="922.0" y="84" font-size="18" font-weight="600" fill="#E6EDF3">Test VLA</text>
    <text x="922.0" y="111" font-size="15" fill="#9198A1">Run the policy on the</text>
    <text x="922.0" y="131" font-size="15" fill="#9198A1">held-out layout</text>
  </g>
</svg>
